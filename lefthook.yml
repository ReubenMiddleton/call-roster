# lefthook over husky: one YAML, parallel execution, a single Go binary, no shell
# indirection. See docs/DECISIONS.md.
#
# Split rationale: type-checking and the test suite CANNOT meaningfully scope to staged
# files, so putting them on pre-commit would either be wrong or unbearably slow. They
# run on pre-push instead. Pre-commit stays fast and file-scoped.

pre-commit:
  parallel: true
  commands:
    format-and-lint:
      glob: "*.{ts,tsx,mts,cts,js,jsx,mjs,cjs,json,jsonc,css,md}"
      run: npx lint-staged

    # Staged-secret scan. Fails loudly if gitleaks is missing — see scripts/run-gitleaks.mjs.
    secrets:
      run: node scripts/run-gitleaks.mjs protect --staged --redact --verbose

    # The data boundary that makes a public repo safe for thirteen real people.
    # Cheap, mechanical, and the only thing still enforcing this in six months.
    no-real-names:
      run: node scripts/check-no-real-names.mjs

pre-push:
  parallel: true
  commands:
    typecheck:
      run: npm run typecheck

    test:
      run: npm run test

    docs:
      run: npm run docs:check
