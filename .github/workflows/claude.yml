name: Claude mention

# Answers an explicit `@claude` mention on an issue or pull request. This is the *interactive*
# half of the integration and the only one a human starts deliberately — `claude-review.yml`
# runs itself on every PR, and `claude-ci-watch.yml` runs on a schedule.
#
# Adapted from the file `/install-github-app` generates, with three changes:
#   - `actions/checkout@v7`, matching every other workflow here rather than the generated `@v4`.
#   - The generated companion `claude-code-review.yml` is deliberately NOT taken. It duplicates
#     `claude-review.yml`'s trigger with a generic prompt that knows nothing about this project's
#     data boundary, confidence tags, glossary or constraint catalogue — two reviewers on every
#     pull request, the worse one adding noise.
#   - No `prompt`, on purpose: with none set the action waits for the trigger phrase, which is
#     what makes this the interactive mode rather than a second automatic reviewer.
#
# Requires the Claude GitHub App and CLAUDE_CODE_OAUTH_TOKEN (task B3), both live since
# 2026-09-08.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read
  id-token: write

concurrency:
  group: claude-mention-${{ github.event.issue.number || github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  claude:
    name: Respond
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only start a runner when `@claude` is actually present. The action re-checks the trigger
    # phrase itself; this just avoids paying for a container on every comment in the repository.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Lets Claude read CI results when asked about a failing build.
          additional_permissions: |
            actions: read
          claude_args: |
            --max-turns 25
